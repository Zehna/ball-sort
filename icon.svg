<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#262A52" stop-opacity="1"/>
      <stop offset="100%" stop-color="#14172B" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="ballRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="55%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#7A0000"/>
    </radialGradient>
    <radialGradient id="ballBlue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#82B1FF"/>
      <stop offset="55%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#003A80"/>
    </radialGradient>
    <radialGradient id="ballGreen" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8CE99A"/>
      <stop offset="55%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#0B5E24"/>
    </radialGradient>
    <radialGradient id="ballYellow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="55%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#8A6D00"/>
    </radialGradient>
    <radialGradient id="ballPurple" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D0A2F7"/>
      <stop offset="55%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#4A1D6B"/>
    </radialGradient>
    <radialGradient id="ballOrange" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="55%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#7A3E00"/>
    </radialGradient>
  </defs>

  <!-- Latar: kotak membulat gelap -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="url(#bgGlow)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Bola yang sedang dituang (di luar tabung) -->
  <circle cx="168" cy="196" r="26" fill="url(#ballPurple)"/>
  <circle cx="158" cy="186" r="8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="132" cy="258" r="22" fill="url(#ballOrange)"/>
  <circle cx="124" cy="250" r="6" fill="#FFFFFF" opacity="0.7"/>

  <!-- Tabung miring menuang -->
  <g transform="rotate(-30 256 256)">
    <!-- Badan tabung kaca -->
    <path d="M 196 120 L 196 340 Q 196 402 256 402 Q 316 402 316 340 L 316 120 Z"
          fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="10" stroke-linejoin="round"/>
    <!-- Kilau vertikal kaca -->
    <path d="M 208 132 L 208 330 Q 208 378 226 392 L 226 132 Z" fill="#FFFFFF" opacity="0.22"/>
    <!-- Bola di dalam tabung -->
    <circle cx="226" cy="348" r="28" fill="url(#ballRed)"/>
    <circle cx="216" cy="338" r="9" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="286" cy="348" r="28" fill="url(#ballBlue)"/>
    <circle cx="276" cy="338" r="9" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="256" cy="292" r="28" fill="url(#ballGreen)"/>
    <circle cx="246" cy="282" r="9" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="226" cy="238" r="28" fill="url(#ballYellow)"/>
    <circle cx="216" cy="228" r="9" fill="#FFFFFF" opacity="0.7"/>
    <!-- Bibir tabung -->
    <rect x="184" y="106" width="144" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
  </g>

  <!-- Kilau bintang kecil -->
  <circle cx="392" cy="140" r="7" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="420" cy="180" r="5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="366" cy="196" r="4" fill="#FFFFFF" opacity="0.6"/>
</svg>
